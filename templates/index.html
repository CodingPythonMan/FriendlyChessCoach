<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>친절한 체스 코치</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#101827;color:#f2f5fa;margin:0;padding:16px}main{max-width:1050px;margin:auto}h1{font-size:clamp(22px,4vw,34px)}.layout{display:grid;grid-template-columns:minmax(280px,540px) 1fr;gap:18px}.panel{background:#1c293c;border-radius:14px;padding:15px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1}.sq{aspect-ratio:1;border:0;position:relative;padding:0;cursor:pointer;font-size:clamp(24px,5vw,53px)}.light{background:#f0d9b5}.dark{background:#b58863}.selected{outline:4px solid #ffce4d;outline-offset:-4px}.target:after{content:"";position:absolute;left:40%;top:40%;width:20%;height:20%;background:#296c45aa;border-radius:50%}.piece{line-height:1}.white{color:#fffdf3;text-shadow:1px 2px 2px #222,-1px 0 #222}.black{color:#151515;text-shadow:1px 1px #ddd}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button.control{background:#37516b;color:white;border:1px solid #6986a0;border-radius:8px;padding:10px;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;min-height:70px;background:#101827;color:white;border:1px solid #6986a0;border-radius:8px;padding:8px}.results{white-space:pre-wrap;line-height:1.65;background:#101827;padding:12px;border-radius:8px;min-height:75px}.error{color:#ffa3a3}.muted{color:#b8c6d7}dialog{background:#1c293c;color:white;border-radius:10px}input{width:100%}@media(max-width:760px){.layout{grid-template-columns:1fr}.sq{font-size:clamp(26px,9vw,58px)}}
</style></head><body><main><h1>♟️ 친절한 Stockfish 체스 코치</h1><p class="muted">수를 두고 실제 엔진의 추천을 한국어로 확인해 보세요.</p><div class="layout"><section class="panel"><h3 id="status">불러오는 중…</h3><div id="board" class="board"></div><div class="controls"><button class="control" id="undo">되돌리기</button><button class="control" id="redo">다시 두기</button><button class="control" id="reset">처음부터</button><button class="control" id="flip">판 뒤집기</button></div><div id="history" class="muted"></div></section><section class="panel"><h2>🔍 Stockfish 분석</h2><label>분석 깊이 <span id="depthLabel">12</span></label><input id="depth" type="range" min="6" max="20" value="12"><div class="controls"><button class="control" id="analyze">✨ 분석하기</button><button class="control" id="best">추천 수 두기</button></div><div class="results" id="results">분석 버튼을 눌러 주세요.</div><h2>📋 FEN 불러오기</h2><textarea id="fen"></textarea><div class="controls"><button class="control" id="load">FEN 적용</button><button class="control" id="copy">FEN 복사</button></div><p class="muted">해설은 엔진 추천 수의 전개·중앙·체크 등 확인 가능한 특징을 설명합니다. 복잡한 전술의 원인을 완벽히 해석하는 AI는 아닙니다.</p></section></div></main><dialog id="promotion"><h3>승격할 기물을 선택하세요</h3><div id="choices"></div><button class="control" onclick="document.getElementById('promotion').close()">취소</button></dialog><script>
const $=id=>document.getElementById(id),START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',G={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟︎'};let fen=START,legal=[],selected='',flipped=false,history=[],future=[],best='',busy=false;
function parse(f){const b={};f.split(' ')[0].split('/').forEach((row,r)=>{let c=0;for(const ch of row){if(/[1-8]/.test(ch))c+=Number(ch);else b['abcdefgh'[c++]+(8-r)]=ch}});return b}
async function api(route,body){const r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),v=await r.json();if(!r.ok)throw Error(v.error||'요청 실패');return v}
function message(s,error=false){$('status').textContent=s;$('status').className=error?'error':''}
function draw(){const b=parse(fen),el=$('board');el.replaceChildren();for(let i=0;i<64;i++){const r=Math.floor(i/8),c=i%8,sq='abcdefgh'[flipped?7-c:c]+(flipped?r+1:8-r),p=b[sq],btn=document.createElement('button');btn.className='sq '+((r+c)%2?'dark':'light')+(selected===sq?' selected':'')+(selected&&legal.some(m=>m.slice(0,2)===selected&&m.slice(2,4)===sq)?' target':'');btn.setAttribute('aria-label',sq);if(p){const span=document.createElement('span');span.className='piece '+(p===p.toUpperCase()?'white':'black');span.textContent=G[p];btn.append(span)}btn.onclick=()=>square(sq);el.append(btn)}$('fen').value=fen;$('history').textContent=history.map((x,i)=>(Math.floor(i/2)+1)+(i%2?'...':'.')+x.san).join('  ');$('undo').disabled=!history.length;$('redo').disabled=!future.length;$('best').disabled=!best}
async function sync(){const s=await api('position',{fen});legal=s.legal;message(s.status);draw()}
async function square(sq){if(busy)return;const b=parse(fen),p=b[sq],white=fen.split(' ')[1]==='w',mine=p&&(white?p===p.toUpperCase():p===p.toLowerCase());if(selected){const choices=legal.filter(m=>m.slice(0,2)===selected&&m.slice(2,4)===sq);if(choices.length){if(choices.length===1)await play(choices[0]);else{const box=$('choices');box.replaceChildren();for(const m of choices){const button=document.createElement('button');button.className='control';button.textContent={q:'퀸',r:'룩',b:'비숍',n:'나이트'}[m[4]];button.onclick=()=>{$('promotion').close();play(m)};box.append(button)}$('promotion').showModal()}return}}selected=mine?(selected===sq?'':sq):'';draw()}
async function play(move){if(busy)return;busy=true;try{const old=fen,r=await api('move',{fen,move});history.push({fen:old,move,san:r.san});future=[];fen=r.fen;selected='';best='';$('results').textContent='포지션이 바뀌었습니다. 다시 분석해 주세요.';await sync()}catch(e){message(e.message,true)}finally{busy=false}}
$('undo').onclick=async()=>{if(!history.length)return;const last=history.pop();future.push(last);fen=last.fen;best='';selected='';await sync()};
$('redo').onclick=async()=>{if(!future.length)return;const x=future.pop();try{const r=await api('move',{fen,move:x.move});history.push(x);fen=r.fen;best='';await sync()}catch(e){message(e.message,true)}};
$('reset').onclick=async()=>{fen=START;history=[];future=[];best='';selected='';await sync()};
$('flip').onclick=()=>{flipped=!flipped;draw()};
$('load').onclick=async()=>{const value=$('fen').value.trim();try{const s=await api('position',{fen:value});fen=s.fen;history=[];future=[];best='';selected='';legal=s.legal;message(s.status);draw();$('results').textContent='FEN 적용 완료'}catch(e){message(e.message,true)}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(fen);message('FEN 복사 완료')}catch(e){message('복사 실패: 텍스트를 직접 선택해 주세요.',true)}};
$('depth').oninput=()=>{$('depthLabel').textContent=$('depth').value};
$('analyze').onclick=async()=>{const original=fen;best='';$('analyze').disabled=true;$('results').textContent='Stockfish 분석 중…';try{const r=await api('analyze',{fen:original,depth:+$('depth').value});if(original!==fen){$('results').textContent='포지션이 변경되었습니다. 다시 분석하세요.';return}best=r.lines?.[0]?.move||'';const rows=(r.lines||[]).map((x,i)=>{const score=x.mate!==null?'메이트 '+x.mate:(x.score_cp/100).toFixed(2);return (i+1)+'순위 '+x.san+' (평가 '+score+')\n'+x.explanation+'\n예상 수순: '+x.pv.join(' → ')});$('results').textContent=(r.score_text||'')+'\n'+(r.explanation||'')+'\n\n'+rows.join('\n\n');draw()}catch(e){$('results').textContent='분석 실패: '+e.message}finally{$('analyze').disabled=false}};
$('best').onclick=()=>{if(best)play(best)};
sync().catch(e=>message(e.message,true));
</script></body></html>
